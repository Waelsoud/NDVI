<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>حرق كود ESP32 - حساس AS7341</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #0b1120; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; border: 1px solid #10b98155; border-radius: 20px; padding: 32px; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    h1 { color: #10b981; font-size: 22px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 13px; line-height: 1.8; margin-bottom: 24px; }
    esp-web-install-button::part(button) { background: #10b981; color: #fff; font-family: 'Cairo', sans-serif; font-weight: bold; padding: 12px 28px; border-radius: 12px; border: none; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>حرق السوفتوير على شريحة ESP32</h1>
    <p>1. وصّل شريحة ESP32 بالكمبيوتر عبر كابل USB داتا.<br>2. استخدم متصفح Chrome أو Edge.<br>3. اضغط الزر بالأسفل واختر منفذ الـ COM (اضغط زر BOOT على البوردة لو طُلب منك).</p>
    <esp-web-install-button manifest="./manifest.json">
      <button slot="activate">⚡ توصيل وحرق الكود الآن</button>
    </esp-web-install-button>
  </div>
</body>
</html>
